<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trash Schedule</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗑️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161922;
    --border: #2a3040;
    --accent: #e8c97a;
    --text: #f0f2f8;
    --muted: #8a95aa;
    --c1: #7ac8e8;
    --c2: #7ae8b4;
    --c3: #e87a9c;
    --c4: #c87ae8;
    --c5: #e8c97a;
    --c6: #e8a07a;
    --c7: #a0e87a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding-bottom: 48px;
  }

  header {
    padding: 44px 20px 24px;
    border-bottom: 1px solid var(--border);
    max-width: 480px;
    margin: 0 auto;
  }

  .label {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: #8a95aa;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 30px;
    font-weight: 400;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  h1 em { font-style: italic; color: var(--accent); }

  .next-card {
    background: linear-gradient(135deg, rgba(232,201,122,0.1) 0%, rgba(232,201,122,0.04) 100%);
    border: 1px solid rgba(232,201,122,0.35);
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .next-icon { font-size: 24px; line-height: 1; }
  .next-body { flex: 1; }

  .next-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .next-title {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    color: var(--text);
  }

  .next-date {
    font-size: 10px;
    color: #8a95aa;
    margin-top: 2px;
    letter-spacing: 0.05em;
  }

  .next-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

  .filter-bar {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    gap: 7px;
    overflow-x: auto;
    scrollbar-width: none;
    border-bottom: 1px solid var(--border);
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .chip {
    flex-shrink: 0;
    padding: 5px 13px;
    border-radius: 100px;
    border: 1px solid #3a4455;
    background: #1e2330;
    color: #c0c8d8;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #0d0f14; font-weight: 500; }
  .chip:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  .content {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 16px;
  }

  .month-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 18px 4px 8px;
  }
  .month-header:first-child { margin-top: 4px; }

  .month-name {
    font-family: 'DM Serif Display', serif;
    font-size: 12px;
    color: #8a95aa;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .month-line { flex: 1; height: 1px; background: var(--border); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    padding: 14px 16px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform 0.12s;
  }
  .card:active { transform: scale(0.98); }

  .date-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 40px;
    flex-shrink: 0;
  }

  .date-day {
    font-size: 22px;
    font-weight: 300;
    color: #f0f2f8;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .date-dow {
    font-size: 9px;
    color: #8a95aa;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 3px;
  }

  .divider { width: 1px; height: 32px; background: var(--border); flex-shrink: 0; }

  .room-name {
    font-family: 'DM Serif Display', serif;
    font-size: 17px;
    color: var(--text);
    flex: 1;
  }

  .room-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.05em;
  }
  .empty-icon { font-size: 28px; margin-bottom: 10px; opacity: 0.4; }
</style>
</head>
<body>

<header>
  <div class="label">🗑️ Trash Removal</div>
  <h1>Whose <em>Turn</em> Is It?</h1>
  <div class="next-card" id="next-card" style="display:none">
    <div class="next-icon">🗑️</div>
    <div class="next-body">
      <div class="next-label">Next Up</div>
      <div class="next-title" id="next-title">—</div>
      <div class="next-date" id="next-date">—</div>
    </div>
    <div class="next-dot" id="next-dot"></div>
  </div>
</header>

<div class="filter-bar" id="filter-bar">
  <button class="chip active" data-room="0">All</button>
  <button class="chip" data-room="1">Room 1</button>
  <button class="chip" data-room="2">Room 2</button>
  <button class="chip" data-room="3">Room 3</button>
  <button class="chip" data-room="4">Room 4</button>
  <button class="chip" data-room="5">Room 5</button>
  <button class="chip" data-room="6">Room 6</button>
  <button class="chip" data-room="7">Room 7</button>
</div>

<div class="content" id="content"></div>

<script>
const COLORS = ['','var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)','var(--c6)','var(--c7)'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

const data = [{"date":"2026-02-21","expectedRoom":1},{"date":"2026-02-25","expectedRoom":2},{"date":"2026-02-28","expectedRoom":3},{"date":"2026-03-04","expectedRoom":4},{"date":"2026-03-07","expectedRoom":5},{"date":"2026-03-11","expectedRoom":6},{"date":"2026-03-14","expectedRoom":7},{"date":"2026-03-18","expectedRoom":1},{"date":"2026-03-21","expectedRoom":2},{"date":"2026-03-25","expectedRoom":3},{"date":"2026-03-28","expectedRoom":4},{"date":"2026-04-01","expectedRoom":5},{"date":"2026-04-04","expectedRoom":6},{"date":"2026-04-08","expectedRoom":7},{"date":"2026-04-11","expectedRoom":1},{"date":"2026-04-15","expectedRoom":2},{"date":"2026-04-18","expectedRoom":3},{"date":"2026-04-22","expectedRoom":4},{"date":"2026-04-25","expectedRoom":5},{"date":"2026-04-29","expectedRoom":6},{"date":"2026-05-02","expectedRoom":7},{"date":"2026-05-06","expectedRoom":1},{"date":"2026-05-09","expectedRoom":2},{"date":"2026-05-13","expectedRoom":3},{"date":"2026-05-16","expectedRoom":4},{"date":"2026-05-20","expectedRoom":5},{"date":"2026-05-23","expectedRoom":6},{"date":"2026-05-27","expectedRoom":7},{"date":"2026-05-30","expectedRoom":1},{"date":"2026-06-03","expectedRoom":2},{"date":"2026-06-06","expectedRoom":3},{"date":"2026-06-10","expectedRoom":4},{"date":"2026-06-13","expectedRoom":5},{"date":"2026-06-17","expectedRoom":6},{"date":"2026-06-20","expectedRoom":7},{"date":"2026-06-24","expectedRoom":1},{"date":"2026-06-27","expectedRoom":2},{"date":"2026-07-01","expectedRoom":3},{"date":"2026-07-04","expectedRoom":4},{"date":"2026-07-08","expectedRoom":5},{"date":"2026-07-11","expectedRoom":6},{"date":"2026-07-15","expectedRoom":7},{"date":"2026-07-18","expectedRoom":1},{"date":"2026-07-22","expectedRoom":2},{"date":"2026-07-25","expectedRoom":3},{"date":"2026-07-29","expectedRoom":4},{"date":"2026-08-01","expectedRoom":5},{"date":"2026-08-05","expectedRoom":6},{"date":"2026-08-08","expectedRoom":7},{"date":"2026-08-12","expectedRoom":1},{"date":"2026-08-15","expectedRoom":2},{"date":"2026-08-19","expectedRoom":3},{"date":"2026-08-22","expectedRoom":4},{"date":"2026-08-26","expectedRoom":5},{"date":"2026-08-29","expectedRoom":6},{"date":"2026-09-02","expectedRoom":7},{"date":"2026-09-05","expectedRoom":1},{"date":"2026-09-09","expectedRoom":2},{"date":"2026-09-12","expectedRoom":3},{"date":"2026-09-16","expectedRoom":4},{"date":"2026-09-19","expectedRoom":5},{"date":"2026-09-23","expectedRoom":6},{"date":"2026-09-26","expectedRoom":7},{"date":"2026-09-30","expectedRoom":1},{"date":"2026-10-03","expectedRoom":2},{"date":"2026-10-07","expectedRoom":3},{"date":"2026-10-10","expectedRoom":4},{"date":"2026-10-14","expectedRoom":5},{"date":"2026-10-17","expectedRoom":6},{"date":"2026-10-21","expectedRoom":7},{"date":"2026-10-24","expectedRoom":1},{"date":"2026-10-28","expectedRoom":2},{"date":"2026-10-31","expectedRoom":3},{"date":"2026-11-04","expectedRoom":4},{"date":"2026-11-07","expectedRoom":5},{"date":"2026-11-11","expectedRoom":6},{"date":"2026-11-14","expectedRoom":7},{"date":"2026-11-18","expectedRoom":1},{"date":"2026-11-21","expectedRoom":2},{"date":"2026-11-25","expectedRoom":3},{"date":"2026-11-28","expectedRoom":4},{"date":"2026-12-02","expectedRoom":5},{"date":"2026-12-05","expectedRoom":6},{"date":"2026-12-09","expectedRoom":7},{"date":"2026-12-12","expectedRoom":1},{"date":"2026-12-16","expectedRoom":2},{"date":"2026-12-19","expectedRoom":3},{"date":"2026-12-23","expectedRoom":4},{"date":"2026-12-26","expectedRoom":5},{"date":"2026-12-30","expectedRoom":6},{"date":"2027-01-02","expectedRoom":7},{"date":"2027-01-06","expectedRoom":1},{"date":"2027-01-09","expectedRoom":2},{"date":"2027-01-13","expectedRoom":3},{"date":"2027-01-16","expectedRoom":4},{"date":"2027-01-20","expectedRoom":5},{"date":"2027-01-23","expectedRoom":6},{"date":"2027-01-27","expectedRoom":7},{"date":"2027-01-30","expectedRoom":1},{"date":"2027-02-03","expectedRoom":2},{"date":"2027-02-06","expectedRoom":3},{"date":"2027-02-10","expectedRoom":4},{"date":"2027-02-13","expectedRoom":5},{"date":"2027-02-17","expectedRoom":6}];

const today = new Date(); today.setHours(0,0,0,0);

// Next upcoming
const nextItem = data.find(item => new Date(item.date + 'T12:00:00') >= today);
if (nextItem) {
  const d = new Date(nextItem.date + 'T12:00:00');
  document.getElementById('next-card').style.display = 'flex';
  document.getElementById('next-title').textContent = `Room ${nextItem.expectedRoom}`;
  document.getElementById('next-date').textContent = `${DAYS[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`;
  document.getElementById('next-dot').style.background = COLORS[nextItem.expectedRoom];
}

let activeRoom = 0;

function render() {
  const filtered = activeRoom === 0 ? data : data.filter(i => i.expectedRoom === activeRoom);
  const content = document.getElementById('content');
  content.innerHTML = '';

  if (!filtered.length) {
    content.innerHTML = `<div class="empty"><div class="empty-icon">🗑️</div>No entries found.</div>`;
    return;
  }

  let lastKey = null;
  filtered.forEach(item => {
    const d = new Date(item.date + 'T12:00:00');
    const key = `${d.getFullYear()}-${d.getMonth()}`;
    const isPast = d < today;

    if (key !== lastKey) {
      lastKey = key;
      const mh = document.createElement('div');
      mh.className = 'month-header';
      mh.innerHTML = `<span class="month-name">${MONTHS[d.getMonth()]} ${d.getFullYear()}</span><div class="month-line"></div>`;
      content.appendChild(mh);
    }

    const card = document.createElement('div');
    card.className = 'card';
    card.style.opacity = isPast ? '0.35' : '1';
    card.innerHTML = `
      <div class="date-block">
        <div class="date-day">${d.getDate()}</div>
        <div class="date-dow">${DAYS[d.getDay()]}</div>
      </div>
      <div class="divider"></div>
      <div class="room-name">Room ${item.expectedRoom}</div>
      <div class="room-dot" style="background:${COLORS[item.expectedRoom]}"></div>`;
    content.appendChild(card);
  });
}

document.getElementById('filter-bar').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  activeRoom = parseInt(chip.dataset.room);
  render();
});

render();
</script>
</body>
</html>
